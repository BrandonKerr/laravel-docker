services:
  php:
    build:
      args:
        user: ${USER:-__PROJECT_NAME__}
        uid: ${UID:-1000}
      context: ./
      dockerfile: Dockerfile
    image: __PROJECT_NAME__
    container_name: __PROJECT_NAME__-php
    restart: unless-stopped
    working_dir: /var/www/
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www
    networks:
      - __PROJECT_NAME__
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  bun:
    image: oven/bun:alpine
    container_name: __PROJECT_NAME__-bun
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    networks:
      - __PROJECT_NAME__
    depends_on:
      - php

  db:
    image: mariadb:12
    container_name: __PROJECT_NAME__-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_USER: ${DB_USERNAME:-laravel}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - __PROJECT_NAME__
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.29-alpine
    container_name: __PROJECT_NAME__-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - __PROJECT_NAME__
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  __PROJECT_NAME__:
    driver: bridge

volumes:
  mysql_data:
  node_modules:
