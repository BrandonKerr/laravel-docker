services:
  app:
    build:
      args:
        user: my_project
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: my_project
    container_name: my_project-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - my_project
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  node:
    image: node:22-alpine
    container_name: my_project-node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
    networks:
      - my_project
    depends_on:
      - app

  db:
    image: mariadb:12
    container_name: my_project-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_USER: ${DB_USERNAME}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my_project
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.29-alpine
    container_name: my_project-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - my_project
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  my_project:
    driver: bridge

volumes:
  mysql_data:
  node_modules:
